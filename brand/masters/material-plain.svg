<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1050" viewBox="0 0 750 1050">
  <filter id="paper" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="7" result="noise"/>
    <feColorMatrix type="saturate" values="0" in="noise" result="mono"/>
    <feComponentTransfer in="mono"><feFuncA type="table" tableValues="0 0.28"/></feComponentTransfer>
  </filter>
      <rect width="750" height="1050" fill="url(#paperWash)"/>
      <defs>
        <radialGradient id="paperWash" cx=".35" cy=".2" r=".9">
          <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
          <stop offset=".58" stop-color="#d9cfbd" stop-opacity=".03"/>
          <stop offset="1" stop-color="#3b3328" stop-opacity=".14"/>
        </radialGradient>
      </defs>
      <rect width="750" height="1050" filter="url(#paper)" opacity=".8"/></svg>