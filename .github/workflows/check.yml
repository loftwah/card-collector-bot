name: Checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, build and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: "10.34.4"
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.4"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types and tests
        run: pnpm check

      - name: Build production bundle without private environment files
        env:
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
          CLOUDFLARE_INCLUDE_PROCESS_ENV: "false"
        run: |
          pnpm build
          test ! -e dist/server/.dev.vars

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Bootstrap local browser fixtures
        env:
          FOILBURY_URL: http://localhost:5173
        run: |
          pnpm setup:local --skip-sources
          node scripts/setup-ci-fixtures.mjs

      - name: Check authentication, editorial, album and privacy journeys
        env:
          FOILBURY_URL: http://localhost:5173
        run: |
          pnpm test:auth
          pnpm test:editorial
          pnpm test:album
          pnpm test:privacy

      - name: Stop local server
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { stopDevServer } from "./scripts/lib/local.mjs";
          await stopDevServer();
          NODE
