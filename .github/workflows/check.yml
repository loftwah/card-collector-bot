name: Release and Access checks

on:
  pull_request:
    paths:
      - ".github/workflows/check.yml"
      - "scripts/check.mjs"
      - "scripts/*production.mjs"
      - "scripts/test-deployed.mjs"
      - "scripts/configure-cloudflare-access.mjs"
      - "scripts/lib/routine-release.mjs"
      - "scripts/lib/release-artifact.mjs"
      - "scripts/lib/source-identity.mjs"
      - "scripts/lib/cloudflare-access-app.mjs"
      - "tests/scripts/release-gate.test.mjs"
      - "tests/scripts/routine-release.test.mjs"
      - "tests/scripts/cloudflare-access-app.test.mjs"
      - "wrangler.production.jsonc"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: node scripts/check.mjs
