name: Checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: Select affected browser journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      started_at: ${{ steps.clock.outputs.started_at }}
      browser: ${{ steps.scope.outputs.browser }}
      auth: ${{ steps.scope.outputs.auth }}
      editorial: ${{ steps.scope.outputs.editorial }}
      album: ${{ steps.scope.outputs.album }}
      privacy: ${{ steps.scope.outputs.privacy }}
    steps:
      - name: Start the test-flow clock
        id: clock
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select affected browser journeys
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/foilbury-changed-paths"
          node scripts/ci-affected.mjs "$RUNNER_TEMP/foilbury-changed-paths" >> "$GITHUB_OUTPUT"

  check:
    name: Typecheck, tests and build
    needs: scope
    runs-on: ubuntu-24.04
    # The budget job below enforces the five-minute target. Six minutes lets a
    # slow gate fail with a clear message instead of being cancelled mid-test.
    timeout-minutes: 6
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: "10.34.4"
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.4"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types and tests
        run: pnpm check

      - name: Build production bundle without private environment files
        env:
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
          CLOUDFLARE_INCLUDE_PROCESS_ENV: "false"
        run: |
          node scripts/build-production.mjs --skip-typecheck
          test ! -e dist/server/.dev.vars

  browser:
    name: Browser journeys
    needs: scope
    if: needs.scope.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: "10.34.4"
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.4"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Bootstrap local browser fixtures
        env:
          FOILBURY_URL: http://localhost:5173
        run: |
          pnpm setup:local --skip-sources
          node scripts/setup-ci-fixtures.mjs

      - name: Check authentication journey
        if: needs.scope.outputs.auth == 'true'
        env:
          FOILBURY_URL: http://localhost:5173
        run: pnpm test:auth

      - name: Check editorial journey
        if: needs.scope.outputs.editorial == 'true'
        env:
          FOILBURY_URL: http://localhost:5173
        run: pnpm test:editorial

      - name: Check album journey
        if: needs.scope.outputs.album == 'true'
        env:
          FOILBURY_URL: http://localhost:5173
        run: pnpm test:album

      - name: Check privacy journey
        if: needs.scope.outputs.privacy == 'true'
        env:
          FOILBURY_URL: http://localhost:5173
        run: pnpm test:privacy

      - name: Stop local server
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { stopDevServer } from "./scripts/lib/local.mjs";
          await stopDevServer();
          NODE

  budget:
    name: Verify five-minute test-flow budget
    needs: [scope, check, browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify the five-minute test-flow budget
        env:
          STARTED_AT: ${{ needs.scope.outputs.started_at }}
          CHECK_RESULT: ${{ needs.check.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          BROWSER: ${{ needs.scope.outputs.browser }}
          AUTH: ${{ needs.scope.outputs.auth }}
          EDITORIAL: ${{ needs.scope.outputs.editorial }}
          ALBUM: ${{ needs.scope.outputs.album }}
          PRIVACY: ${{ needs.scope.outputs.privacy }}
        run: |
          if [ -z "$STARTED_AT" ]; then
            echo "::error::The test-flow clock did not start; the scope job failed."
            exit 1
          fi
          elapsed=$(( $(date +%s) - STARTED_AT ))
          {
            echo "### Test-flow budget"
            echo ""
            echo "| Measure | Value |"
            echo "| --- | --- |"
            echo "| Elapsed | ${elapsed}s |"
            echo "| Limit | 300s |"
            echo "| Check job | ${CHECK_RESULT} |"
            echo "| Browser job | ${BROWSER_RESULT} |"
            echo "| Browser journeys | ${BROWSER} |"
            echo "| Selected journeys | auth=${AUTH}, editorial=${EDITORIAL}, album=${ALBUM}, privacy=${PRIVACY} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CHECK_RESULT" != "success" ]; then
            echo "::error::The correctness gate did not pass (${CHECK_RESULT})."
            exit 1
          fi
          if [ "$BROWSER_RESULT" != "success" ] && [ "$BROWSER_RESULT" != "skipped" ]; then
            echo "::error::The browser journeys did not pass (${BROWSER_RESULT})."
            exit 1
          fi
          if [ "$elapsed" -gt 300 ]; then
            echo "::error::The test flow took ${elapsed}s, over the 300s budget."
            exit 1
          fi
          echo "Test flow completed in ${elapsed}s, within the 300s budget by $((300 - elapsed))s."
